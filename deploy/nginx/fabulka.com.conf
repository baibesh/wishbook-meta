# /etc/nginx/sites-enabled/fabulka.com — certbot adds the TLS server block.

# Do not tell the world which nginx version runs here (http context, applies to every server).
server_tokens off;

# Books cost money to make: one address may start only so many per minute. Only POSTs count,
# so polling a book's progress is never limited.
map $request_method $fabulka_post_ip {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $fabulka_post_ip zone=fabulka_post:10m rate=10r/m;

server {
    listen 80;
    server_name fabulka.com www.fabulka.com;

    # A toy photo, scaled down in the browser, is the largest request.
    client_max_body_size 10m;

    # Security headers; locations below add none of their own, so they inherit these.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # The microphone only for the site itself: the form can be filled in by voice (VOICE_INPUT).
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    # certbot turns this block into the 443 server; browsers ignore HSTS over plain HTTP anyway.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Next.js announces itself; nobody needs to know.
    proxy_hide_header X-Powered-By;

    proxy_set_header Host $host;
    # The API trusts X-Real-IP for its country check: nginx must always overwrite it.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/api/(books|toys|quota/purchase|orders|admin/login)$ {
        limit_req zone=fabulka_post burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:13110;
    }

    location / {
        proxy_pass http://127.0.0.1:13110;
        # Generated PDFs are several megabytes.
        proxy_read_timeout 120s;
    }
}
