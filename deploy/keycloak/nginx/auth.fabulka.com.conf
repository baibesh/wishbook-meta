# auth.fabulka.com: Keycloak for Fabulka parent accounts (deploy/keycloak).
# Installed on the Finland server as /etc/nginx/sites-available/auth.fabulka.com,
# symlinked from sites-enabled. Keycloak listens on 127.0.0.1:18480 (KC_HTTP_HOST_PORT).
# Its management port (health) is not published and is never proxied.
#
# Certificate: certbot --nginx -d auth.fabulka.com (renewed by the certbot timer).
# Admin basic-auth users: /etc/nginx/fabulka-auth.htpasswd (not in git).
# All names below are prefixed with fabulka_auth_ because they share the http{} context
# with every other site on the server.

# Brute-force brake for form POSTs (login, registration, password reset). Per IP, so keep it
# loose enough for mobile carrier NAT; Keycloak brute-force detection also locks per account.
map $request_method $fabulka_auth_post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $fabulka_auth_post_key zone=fabulka_auth_post:10m rate=60r/m;

# Admin console and master realm: nginx basic auth in front of Keycloak's own login.
# The console's REST calls carry a Keycloak bearer token in Authorization, which a browser
# cannot combine with basic auth; those skip basic auth and Keycloak validates the token.
map $http_authorization $fabulka_auth_admin_basic {
    "~*^Bearer\s" off;
    default       "Fabulka admin";
}
# The basic-auth header must not reach Keycloak (it would read it as client credentials).
map $http_authorization $fabulka_auth_admin_upstream_authz {
    "~*^Basic\s" "";
    default      $http_authorization;
}

upstream fabulka_auth_keycloak {
    server 127.0.0.1:18480;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name auth.fabulka.com;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.fabulka.com;

    ssl_certificate /etc/letsencrypt/live/auth.fabulka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.fabulka.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/auth.fabulka.com.access.log;
    error_log /var/log/nginx/auth.fabulka.com.error.log;

    # Security headers. Keycloak sends its own copies of some; hide them so each appears once.
    # (No add_header inside locations: that would drop these.)
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Proxy settings shared by every location.
    set $fabulka_auth_upstream_authz $http_authorization;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Authorization $fabulka_auth_upstream_authz;
    # Overwrite, never append: Keycloak trusts the first X-Forwarded-For value.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded "";
    # Keycloak's auth cookies make response headers large.
    proxy_buffer_size 128k;
    proxy_buffers 8 128k;
    proxy_busy_buffers_size 256k;
    proxy_read_timeout 60s;

    limit_req_status 429;

    location = / {
        return 302 https://fabulka.com/;
    }

    # Logo for emails (stable URL; theme resource URLs change with every Keycloak version).
    location = /brand/fabulka-logo.png {
        alias /opt/fabulka-auth/themes/fabulka/login/resources/img/logo.png;
        expires 7d;
    }

    # Admin console + admin REST API.
    location /admin/ {
        auth_basic $fabulka_auth_admin_basic;
        auth_basic_user_file /etc/nginx/fabulka-auth.htpasswd;
        set $fabulka_auth_upstream_authz $fabulka_auth_admin_upstream_authz;
        proxy_pass http://fabulka_auth_keycloak;
    }

    # Master realm = where admins log in. Nobody else has a reason to be here.
    location /realms/master/ {
        auth_basic $fabulka_auth_admin_basic;
        auth_basic_user_file /etc/nginx/fabulka-auth.htpasswd;
        set $fabulka_auth_upstream_authz $fabulka_auth_admin_upstream_authz;
        limit_req zone=fabulka_auth_post burst=30 nodelay;
        proxy_pass http://fabulka_auth_keycloak;
    }

    # OIDC endpoints of the fabulka realm. Not rate limited: the app server exchanges
    # every user's code from a single IP, and fabulka-web has direct grants disabled,
    # so passwords cannot be guessed here.
    location /realms/fabulka/protocol/openid-connect/ {
        proxy_pass http://fabulka_auth_keycloak;
    }

    # Login, registration, password reset, account console, Google broker.
    location /realms/ {
        limit_req zone=fabulka_auth_post burst=30 nodelay;
        proxy_pass http://fabulka_auth_keycloak;
    }

    # Our own theme: Keycloak caches resources for 30 days under a path that changes only
    # with the Keycloak version, so theme edits would not reach browsers. Cache 1 hour instead.
    location ~ ^/resources/[^/]+/(login|email)/fabulka/ {
        proxy_pass http://fabulka_auth_keycloak;
        # proxy_hide_header here replaces the server-level list, so repeat it.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cache-Control;
        expires 1h;
    }

    # Stock Keycloak assets and JS.
    location /resources/ {
        proxy_pass http://fabulka_auth_keycloak;
    }

    location / {
        proxy_pass http://fabulka_auth_keycloak;
    }
}
