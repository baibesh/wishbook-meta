# Fabulka email theme: branded HTML for verify email, password reset and execute actions.
# Other emails come from the parent (keycloak -> base).
parent=keycloak
locales=ru,kk,en

# Absolute URLs: email clients cannot load theme resources by relative path.
# nginx serves the logo at this stable address (see nginx/auth.fabulka.com.conf).
logoUrl=https://auth.fabulka.com/brand/fabulka-logo.png
siteUrl=https://fabulka.com
