# Fabulka login theme: the stock keycloak.v2 pages, restyled (see resources/css/fabulka.css).
parent=keycloak.v2
import=common/keycloak

# Parent styles first, then ours. Properties not listed here are inherited from keycloak.v2.
styles=css/styles.css css/fabulka.css

# The site is warm and light; keep the login pages light too.
darkMode=false

locales=ru,kk,en
