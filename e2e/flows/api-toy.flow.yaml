# A favourite toy from a photo: upload it, the book picks it up (SAM, Spark and Image are mocked).
device: none
db: ${DATABASE_URL}
params:
  DATABASE_URL:
    required: true
    description: Postgres DSN of the e2e database (e2e/.env)
env:
  childName: "Toy ${Date.now()}"
  # A 16×16 red JPEG.
  photo: "data:image/jpeg;base64,"
http:
  baseUrl: ${API}
  headers:
    X-Client-Key: "e2e-${childName}"
    X-Demo-Code: E2E-DEMO
commands:
  - request:
      method: POST
      url: /toys
      json: { image: "data:image/png;base64,iVBORw0KGgo=" }
      assert: { status: 400 }
  - request:
      method: POST
      url: /books
      json:
        child: { name: "${childName}", age: 5, gender: girl, interests: [мячи], city: Алматы }
        toy: { upload: 0123456789abcdef0123456789abcdef }
      assert: { status: 400, json: { "$.message": { contains: "Фото игрушки не найдено" } } }

  - request:
      method: POST
      url: /toys
      json: { image: "${photo}" }
      extract: { upload: "$.upload" }
      assert: { status: 201 }
  - request:
      method: POST
      url: /books
      json:
        child: { name: "${childName}", age: 5, gender: girl, interests: [мячи], city: Алматы }
        toy: { upload: "${upload}", name: Бусинка }
      extract: { bookId: "$.id" }
      assert: { status: 201 }
  - request:
      url: /books/${bookId}
      retryUntil:
        json: { "$.status": done }
      timeout: 30000
  - request:
      url: /books/${bookId}
      extract: { cutoutUrl: "$.toy.cutoutUrl", sheetUrl: "$.toy.sheetUrl" }
      assert:
        json: { "$.toy.name": Бусинка }
  - request:
      url: ${WEB}${cutoutUrl}
      assert: { status: 200 }
  - request:
      url: ${WEB}${sheetUrl}
      assert: { status: 200 }
  - sql:
      query: >-
        select status::text as status, "toyDescription" as description, pages->0->>'scenePrompt' like '%the toy%' as toy_in_scene
        from "Book" where id = $1
      params: ["${bookId}"]
      readOnly: true
      assert:
        first:
          status: done
          description: a small plush bunny with a red knitted scarf
          toy_in_scene: true
after:
  - sql: { exec: "delete from \"Book\" where child->>'name' = $1", params: ["${childName}"] }
