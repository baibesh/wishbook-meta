# A book of your own: a parent fills in the form and gets a finished book (mock models).
appId: ${WEB}
tags: [smoke, book]
db: ${DATABASE_URL}
params:
  DATABASE_URL:
    required: true
    description: Postgres DSN of the e2e database (e2e/.env)
env:
  childName: "Айгерим ${Date.now()}"
commands:
  - launchApp: { appId: "${WEB}", clearState: true }
  - openLink: "${WEB}/?lang=ru"
  - tapOn: { testId: create-own }
  - tapOn: { testId: child-name }
  - inputText: "${childName}"
  - tapOn: { testId: child-interests }
  - inputText: "космос, лошади"
  - tapOn: { testId: child-pet }
  - inputText: "кот Барсик"
  - tapOn: { testId: book-theme }
  - inputText: "боится темноты"
  - tapOn: { testId: create-book }
  - waitForVisible: { text: "Книга готова", timeout: 30000 }
  - assertVisible: { contains: "${childName} и звёздное путешествие" }
  - waitForVisible: { testId: book-reader }
  - waitForVisible: { testId: reader-position, contains: "1 / " }
  - assertVisible: { testId: download-pdf }
  - assertVisible: { testId: talk-questions }
  - sql:
      query: >-
        select status::text as status, jsonb_array_length(pages) as pages, "costUsd" as cost, "pdfPath" is not null as pdf,
        methodology, theme, "templateId" is null as own
        from "Book" where child->>'name' = $1
      params: ["${childName}"]
      readOnly: true
      assert:
        rows: 1
        first: { status: done, pages: 4, cost: 0, pdf: true, methodology: adventure-quest, theme: "боится темноты", own: true }
after:
  - sql: { exec: "delete from \"Book\" where child->>'name' = $1", params: ["${childName}"] }
