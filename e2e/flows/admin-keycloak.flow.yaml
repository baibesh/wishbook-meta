# The admin through Fabulka ID (the test OIDC provider, AUTH_MOCK): an account with the admin role
# gets in, the password form stays only as the emergency way (ADMIN_PASSWORD_LOGIN in e2e).
appId: ${WEB}
tags: [smoke, admin, auth]
db: ${DATABASE_URL}
params:
  DATABASE_URL:
    required: true
    description: Postgres DSN of the e2e database (e2e/.env)
env:
  email: "admin+${Date.now()}@e2e.test"
commands:
  - request:
      url: ${API}/admin/login-options
      assert: { status: 200, json: { "$.keycloak": true, "$.password": true } }
  - launchApp: { appId: "${WEB}", clearState: true }
  - openLink: "${WEB}/?lang=ru"
  - waitForVisible: { testId: hero-covers }
  - openLink: "${WEB}/admin"
  - waitForVisible: { testId: admin-login-keycloak }
  - assertVisible: { testId: admin-email }
  - tapOn: { testId: admin-login-keycloak }
  - waitForVisible: { testId: mock-login-email, timeout: 10000 }
  - tapOn: { testId: mock-login-email }
  - inputText: "${email}"
  - check: { testId: mock-login-admin }
  - tapOn: { testId: mock-login-submit }
  - waitForVisible: { testId: pause-card, timeout: 15000 }
  - assertUrl: { equals: "${WEB}/admin" }
after:
  - sql: { exec: "delete from \"User\" where sub = $1", params: ["mock:${email}"] }
