# A catalog book: pick it, answer its questions, get a book built on its plot (mock models).
appId: ${WEB}
tags: [smoke, catalog]
db: ${DATABASE_URL}
params:
  DATABASE_URL:
    required: true
    description: Postgres DSN of the e2e database (e2e/.env)
env:
  childName: "Каталог ${Date.now()}"
commands:
  - launchApp: { appId: "${WEB}", clearState: true }
  - openLink: "${WEB}/?lang=ru"
  # The catalog renders only after hydration, by when the page has saved the language.
  - waitForVisible: { testId: catalog }
  - waitForVisible: { testId: catalog }
  - assertVisible: "Тайна снежного барса"
  - tapOn: { testId: template-first-day-kindergarten }
  - waitForVisible: { testId: template-title }
  - assertVisible: { contains: "Социальная история" }
  - tapOn: { testId: child-name }
  - inputText: "${childName}"
  - tapOn: { testId: child-interests }
  - inputText: "машинки"
  # A required answer is missing: the form stops and says which one.
  - tapOn: { testId: create-book }
  - assertVisible: "Ответьте на вопрос «Какую игрушку возьмёт с собой?»"
  - tapOn: { testId: answer-toy }
  - inputText: "плюшевый зайка"
  - selectOption: { testId: answer-goodbye, option: "машем в окно" }
  - tapOn: { testId: create-book }
  - waitForVisible: { text: "Книга готова", timeout: 30000 }
  - assertVisible: { contains: "${childName}: Первый день в детском саду" }
  - assertVisible: { contains: "Методика: Социальная история" }
  - sql:
      query: >-
        select b.status::text as status, b.methodology, t.slug, b.answers->>'toy' as toy, b.answers->>'goodbye' as goodbye
        from "Book" b join "BookTemplate" t on t.id = b."templateId" where b.child->>'name' = $1
      params: ["${childName}"]
      readOnly: true
      assert:
        rows: 1
        first:
          status: done
          methodology: social-story
          slug: first-day-kindergarten
          toy: "плюшевый зайка"
          goodbye: "машем в окно"
after:
  - sql: { exec: "delete from \"Book\" where child->>'name' = $1", params: ["${childName}"] }
