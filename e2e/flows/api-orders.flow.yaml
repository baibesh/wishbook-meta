# An order holds a name and an address: only the browser that made the book can order it or see it.
# The parent gets a confirmation email (kept in memory by the API without RESEND_API_KEY).
device: none
env:
  childName: "Owner ${Date.now()}"
  owner: "e2e-owner-${Date.now()}"
  stranger: "e2e-stranger-${Date.now()}"
  parentEmail: "order-${Date.now()}@e2e.test"
http:
  baseUrl: ${API}
commands:
  - request:
      method: POST
      url: /books
      headers: { X-Client-Key: "${owner}" }
      json: { child: { name: "${childName}", age: 6, gender: girl, interests: [мячи], city: Алматы } }
      extract: { bookId: "$.id" }
      assert: { status: 201 }
  - request:
      url: /books/${bookId}
      retryUntil: { status: 200, json: { "$.status": done } }
      timeout: 30000
  - request:
      method: POST
      url: /orders
      headers: { X-Client-Key: "${stranger}" }
      json: { bookId: "${bookId}", recipientName: Чужой, phone: "+77011234567", email: "${parentEmail}", city: Алматы, address: "ул. Абая, 1", cover: soft, quantity: 1 }
      assert: { status: 404 }
  - request:
      method: POST
      url: /orders
      headers: { X-Client-Key: "${owner}" }
      json: { bookId: "${bookId}", recipientName: Айгерим, phone: "+77011234567", email: "${parentEmail}", city: Алматы, address: "ул. Абая, 1", cover: soft, quantity: 1, locale: kk }
      extract: { orderId: "$.id" }
      assert: { status: 201 }
  - request:
      url: /orders/${orderId}
      headers: { X-Client-Key: "${stranger}" }
      assert: { status: 404 }
  - request:
      url: /orders/${orderId}
      headers: { X-Client-Key: "${owner}" }
      assert: { status: 200, json: { "$.recipientName": Айгерим } }
  - request:
      method: POST
      url: /orders
      headers: { X-Client-Key: "${owner}" }
      json: { bookId: "${bookId}", recipientName: Айгерим, phone: "+77011234567", email: "not-an-email", city: Алматы, address: "ул. Абая, 1", cover: soft, quantity: 1 }
      assert: { status: 400 }
  - request:
      url: /test/mails
      query: { to: "${parentEmail}" }
      retryUntil: { status: 200, json: { "$[0].subject": { contains: "тапсырыс қабылданды" } } }
      extract: { mailText: "$[0].text" }
      timeout: 5000
  - assertTrue: { contains: ["${mailText}", "/orders/${orderId}?lang=kk"] }
