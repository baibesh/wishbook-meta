# The form refuses to start a book without the required answers.
appId: ${WEB}
tags: [smoke, form]
commands:
  - launchApp: { appId: "${WEB}", clearState: true }
  - openLink: "${WEB}/?lang=ru"
  # The catalog renders only after hydration, by when the page has saved the language.
  - waitForVisible: { testId: catalog }
  - openLink: "${WEB}/create"
  - tapOn: { testId: create-book }
  - assertVisible: "Введите имя"
  - assertVisible: "Назовите хотя бы одно увлечение"
  - assertUrl: { equals: "${WEB}/create" }
